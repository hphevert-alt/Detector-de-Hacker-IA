name: Gerar APK Android (AEGIS AI)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk:
    name: Compilar APK Instalável
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK e aceitar licenças
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            mkdir -p /tmp/android-sdk/cmdline-tools
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-sdk/cmdline-tools
            mv /tmp/android-sdk/cmdline-tools/cmdline-tools /tmp/android-sdk/cmdline-tools/latest
            SDK_DIR="/tmp/android-sdk"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependências e gerar build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configurar projeto Android com Capacitor
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          mkdir -p android/app/src/main/java/com/hevertpereira/aegisai
          cp native-android/*.java android/app/src/main/java/com/hevertpereira/aegisai/
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          ANDROID_NS = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ANDROID_NS)
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          existing_perms = {
              el.attrib.get(f'{{{ANDROID_NS}}}name')
              for el in root.findall('uses-permission')
          }
          for perm in [
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.WAKE_LOCK',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
          ]:
              if perm not in existing_perms:
                  el = ET.Element('uses-permission')
                  el.set(f'{{{ANDROID_NS}}}name', perm)
                  root.append(el)
          app = root.find('application')
          if app is not None:
              svc_name = 'com.hevertpereira.aegisai.AegisBackgroundService'
              has_svc = any(
                  s.attrib.get(f'{{{ANDROID_NS}}}name') == svc_name
                  for s in app.findall('service')
              )
              if not has_svc:
                  svc = ET.Element('service')
                  svc.set(f'{{{ANDROID_NS}}}name', svc_name)
                  svc.set(f'{{{ANDROID_NS}}}enabled', 'true')
                  svc.set(f'{{{ANDROID_NS}}}exported', 'false')
                  svc.set(f'{{{ANDROID_NS}}}stopWithTask', 'false')
                  svc.set(f'{{{ANDROID_NS}}}foregroundServiceType', 'dataSync')
                  app.append(svc)
          tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
          PY
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ]; then
              [ -f "$dir/ic_launcher.png" ] && cp public/pwa-192x192.png "$dir/ic_launcher.png"
              [ -f "$dir/ic_launcher_round.png" ] && cp public/pwa-192x192.png "$dir/ic_launcher_round.png"
              [ -f "$dir/ic_launcher_foreground.png" ] && cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png"
            fi
          done
          npx cap sync android

      - name: Compilar APK Debug instalável
        working-directory: android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER:-2}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"2.4.${GITHUB_RUN_NUMBER:-2}\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
