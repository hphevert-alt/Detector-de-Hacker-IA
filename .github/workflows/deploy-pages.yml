name: Publicar no GitHub Pages (AEGIS AI)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar build para GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependências e compilar
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Enviar pasta dist para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar site público
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Fazer deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
